# OPTIONAL local services for machines with Docker (the primary setup uses `npm run db:start`).
# Not verified on the original development machine (no Docker installed) — see KNOWN_LIMITATIONS.
#   docker compose up -d db        # PostgreSQL 17 on 127.0.0.1:54329 (same as the embedded server)
#   docker compose up -d mailpit   # optional SMTP sink with a web UI on http://localhost:8025
# The anvika_test database is created by docker/initdb/01-create-test-db.sql.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: anvika_dev
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  pgdata:
