# Tool configuration for the backend. Dependencies are pinned in requirements*.txt (see requirements.in).
[project]
name = "anvika-backend"
version = "0.1.0"
description = "FastAPI backend for the gold jewellery store"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "F", "W",  # pycodestyle / pyflakes
  "I",            # import sorting
  "B",            # bugbear
  "UP",           # modern syntax
  "S",            # bandit security checks
  "SIM",          # simplifications
  "DTZ",          # naive datetimes
  "RUF",
]
ignore = [
  "B008",   # FastAPI's Depends() in argument defaults is idiomatic
  "RUF012", # SQLAlchemy/Pydantic class attributes
  # Typographic characters (₹, ×, −, —) are intentional in user-facing text and maths comments.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # asserts and dummy secrets are fine in tests
"app/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "db: test needs the PostgreSQL test database",
  "concurrency: test commits real transactions from several threads",
]
filterwarnings = [
  "error::DeprecationWarning:app.*",
  # Starlette 1.x suggests the httpx2 package for its TestClient; httpx still works. Revisit later.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
